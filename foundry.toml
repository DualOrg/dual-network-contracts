[profile.default]
src = "src"
out = "out"
libs = ["lib"]

evm_version = "london"
solc_version = "0.8.35"
auto_detect_solc = false
offline = false

# Emit the Solidity AST in build artifacts (required by halmos symbolic tests).
ast = true

# Optimizer settings - required for complex deployment scripts
optimizer = true
optimizer_runs = 200
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
